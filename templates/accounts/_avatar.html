{% comment %}Usage: {% include "accounts/_avatar.html" with u=some_user size="sm|md|lg|xs" %}{% endcomment %}
{% if u.profile.avatar %}
  <img src="{{ u.profile.avatar.url }}" alt="{{ u.username }}" class="avatar avatar-{{ size|default:'md' }}">
{% else %}
  <span class="avatar avatar-{{ size|default:'md' }} avatar-initials" style="background: {{ u.profile.avatar_color|default:'#64748b' }}">{{ u.username|slice:":1"|upper }}</span>
{% endif %}
